name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 06:00 UTC
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Database
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
          -X GET "https://xwflqqmujxphsvclybzx.supabase.co/rest/v1/keepalive?select=*&limit=1" \
          -H "apikey: sb_publishable_ZbefuIXg5h8Wz7QQxkIP9Q_-5QmdHRB" \
          -H "Authorization: Bearer sb_publishable_ZbefuIXg5h8Wz7QQxkIP9Q_-5QmdHRB"
